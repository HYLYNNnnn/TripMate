services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-tripmate}
      POSTGRES_USER: ${DATABASE_USERNAME:-tripmate}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - tripmate-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 15
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SERVER_ADDRESS: 0.0.0.0
      DATABASE_URL: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-tripmate}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-tripmate}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  tripmate-db:
